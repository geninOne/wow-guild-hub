[build]
  command = "npm run build"
  publish = "dist"

# Prompted by the "Deploy to Netlify" button. All other settings are in .env.example and can be
# added later under Site configuration, Environment variables.
[template.environment]
  BNET_CLIENT_ID = "Client ID from the Battle.net Developer Portal (develop.battle.net)"
  BNET_CLIENT_SECRET = "Client secret from the Battle.net Developer Portal"
  GUILD_SLUGS = "Slug of your guild as in the Blizzard API, e.g. my-guild"
  WEBSITE_NAME = "Name shown at the top of the page, e.g. My Guild"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888

# UI pages serve the app. Deliberately no "/*", so /api/* is never shadowed.
[[redirects]]
  from = "/charakter/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/berufe"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/berufe/*"
  to = "/index.html"
  status = 200

