# Weekly updates for npm and GitHub Actions. Minor and patch updates come grouped, major ones one by one.
# Commit prefixes follow Conventional Commits: fix(deps) for dependencies of the site (gives a patch release),
# chore(deps-dev) for development tools and ci(deps) for actions (neither gives a release of its own).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope
