# Wöchentliche Updates für npm und GitHub Actions. Kleine Updates kommen gebündelt, große einzeln.
# Die Commit-Präfixe folgen Conventional Commits: fix(deps) für Abhängigkeiten der Seite (ergibt ein Patch-Release),
# chore(deps-dev) für Entwicklungswerkzeuge und ci(deps) für Actions (beide ohne eigenes Release).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      klein:
        update-types: [minor, patch]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope
