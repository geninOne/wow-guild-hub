name: Request a feature
description: An idea for a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is it about?
      description: Which problem does the idea solve, or what would your guild do with it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What could it look like? Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered other approaches?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would implement this myself and send a pull request.
