name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte keine Geheimnisse (Client-Secret, Upload-Code, Tokens) in das Issue schreiben.
  - type: textarea
    id: was
    attributes:
      label: Was passiert?
      description: Kurz beschreiben, was falsch läuft. Gern mit Screenshot.
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: So lässt es sich nachstellen
      placeholder: |
        1. Seite /statistik öffnen
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Steht unten im Fuß der Seite.
  - type: dropdown
    id: wo
    attributes:
      label: Wo läuft die Seite?
      options:
        - Netlify
        - Lokal mit Docker
        - Anders
  - type: textarea
    id: logs
    attributes:
      label: Fehlermeldungen oder Logs
      description: Aus der Browser-Konsole oder den Netlify-Function-Logs. Vorher Geheimnisse entfernen.
      render: text
