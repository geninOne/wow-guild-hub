# Publishes a site of your own on Netlify, meant for forks (every production deploy costs credits).
# It never runs in the public repo geninOne/wow-guild-hub: that repo has no site of its own, it only produces
# versions and GitHub releases (release-please.yml).
#
# Triggers:
# 1. Button: Actions, Release, Run workflow, choose a branch (usually main). Deploys exactly that state.
# 2. Push a tag v*, for example after "git pull upstream vX.Y.Z". The tag must match the version in package.json.
# Versions are not bumped here; they come with every update from the public repo.
#
# Without the secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID nothing is deployed: for a tag the run ends with a
# notice, for the button with an error.
# Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID, BNET_CLIENT_ID, BNET_CLIENT_SECRET.
# Variables: GUILD_SLUGS (required), optional GUILD_RANKS, TWINK_RANKS, TITLE_OPT_OUTS, WOW_VERSION, BNET_REGION,
# BNET_LOCALE, COLLECT_CONCURRENCY, COLLECT_BUDGET_MS (otherwise the default, see .env.example).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  prerequisites:
    name: Prerequisites
    if: github.repository != 'geninOne/wow-guild-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Secrets present
        id: secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          missing=""
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID BNET_CLIENT_ID BNET_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          else
            echo "::notice::No deploy, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: prerequisites
    if: needs.prerequisites.outputs.ready == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Netlify
    needs: [prerequisites, check]
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag matches package.json and CHANGELOG.md
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs --check-tag "$TAG"

      # Idempotent: creates new variables, replaces differing ones, leaves equal ones alone. Prints names only.
      - name: Set environment variables of the Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          GUILD_SLUGS: ${{ vars.GUILD_SLUGS }}
          GUILD_RANKS: ${{ vars.GUILD_RANKS }}
          TWINK_RANKS: ${{ vars.TWINK_RANKS }}
          TITLE_OPT_OUTS: ${{ vars.TITLE_OPT_OUTS }}
          WOW_VERSION: ${{ vars.WOW_VERSION }}
          BNET_REGION: ${{ vars.BNET_REGION }}
          BNET_LOCALE: ${{ vars.BNET_LOCALE }}
          COLLECT_CONCURRENCY: ${{ vars.COLLECT_CONCURRENCY }}
          COLLECT_BUDGET_MS: ${{ vars.COLLECT_BUDGET_MS }}
          # Weekly newspaper through your own AI gateway, all optional: anything missing is not set (Netlify keeps
          # the previous value), and without URL or key the sentence templates write the newspaper.
          NEWSPAPER_AI_KEY: ${{ secrets.NEWSPAPER_AI_KEY }}
          NEWSPAPER_AI_URL: ${{ vars.NEWSPAPER_AI_URL }}
          NEWSPAPER_AI_MODEL: ${{ vars.NEWSPAPER_AI_MODEL }}
          NEWSPAPER_AI_EFFORT: ${{ vars.NEWSPAPER_AI_EFFORT }}
          NEWSPAPER_AI_OUTPUT_CONFIG: ${{ vars.NEWSPAPER_AI_OUTPUT_CONFIG }}
          # Site details (name, logo, colors, imprint ...), all optional, see .env.example.
          WEBSITE_NAME: ${{ vars.WEBSITE_NAME }}
          WEBSITE_LANGUAGES: ${{ vars.WEBSITE_LANGUAGES }}
          WEBSITE_NEWSPAPER: ${{ vars.WEBSITE_NEWSPAPER }}
          WEBSITE_DESCRIPTION: ${{ vars.WEBSITE_DESCRIPTION }}
          WEBSITE_TAGLINE: ${{ vars.WEBSITE_TAGLINE }}
          WEBSITE_LOGO: ${{ vars.WEBSITE_LOGO }}
          WEBSITE_LOGO_ALT: ${{ vars.WEBSITE_LOGO_ALT }}
          WEBSITE_FAVICON: ${{ vars.WEBSITE_FAVICON }}
          WEBSITE_APPLE_ICON: ${{ vars.WEBSITE_APPLE_ICON }}
          WEBSITE_OG_IMAGE: ${{ vars.WEBSITE_OG_IMAGE }}
          WEBSITE_THEME_COLOR: ${{ vars.WEBSITE_THEME_COLOR }}
          WEBSITE_COLORS: ${{ vars.WEBSITE_COLORS }}
          WEBSITE_DISCORD: ${{ vars.WEBSITE_DISCORD }}
          WEBSITE_IMPRINT_NAME: ${{ vars.WEBSITE_IMPRINT_NAME }}
          WEBSITE_IMPRINT_ADDRESS: ${{ vars.WEBSITE_IMPRINT_ADDRESS }}
          WEBSITE_IMPRINT_EMAIL: ${{ vars.WEBSITE_IMPRINT_EMAIL }}
          WEBSITE_UMAMI_ID: ${{ vars.WEBSITE_UMAMI_ID }}
          WEBSITE_UMAMI_DOMAINS: ${{ vars.WEBSITE_UMAMI_DOMAINS }}
        run: node scripts/netlify-env.mjs --from-env

      # The CLI builds by itself (npm run build with the site URL), bundles the functions with their schedules
      # (collect-guild hourly, collect-static every four hours, collect-weekly daily) and uploads netlify.toml
      # with the redirects.
      - name: Build and deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TELEMETRY_DISABLED: "1"
          VERSION: ${{ steps.version.outputs.version }}
          # The interface is built here, so pass the site details directly, not only on Netlify.
          WEBSITE_NAME: ${{ vars.WEBSITE_NAME }}
          WEBSITE_LANGUAGES: ${{ vars.WEBSITE_LANGUAGES }}
          WEBSITE_NEWSPAPER: ${{ vars.WEBSITE_NEWSPAPER }}
          WEBSITE_DESCRIPTION: ${{ vars.WEBSITE_DESCRIPTION }}
          WEBSITE_TAGLINE: ${{ vars.WEBSITE_TAGLINE }}
          WEBSITE_LOGO: ${{ vars.WEBSITE_LOGO }}
          WEBSITE_LOGO_ALT: ${{ vars.WEBSITE_LOGO_ALT }}
          WEBSITE_FAVICON: ${{ vars.WEBSITE_FAVICON }}
          WEBSITE_APPLE_ICON: ${{ vars.WEBSITE_APPLE_ICON }}
          WEBSITE_OG_IMAGE: ${{ vars.WEBSITE_OG_IMAGE }}
          WEBSITE_THEME_COLOR: ${{ vars.WEBSITE_THEME_COLOR }}
          WEBSITE_COLORS: ${{ vars.WEBSITE_COLORS }}
          WEBSITE_DISCORD: ${{ vars.WEBSITE_DISCORD }}
          WEBSITE_IMPRINT_NAME: ${{ vars.WEBSITE_IMPRINT_NAME }}
          WEBSITE_IMPRINT_ADDRESS: ${{ vars.WEBSITE_IMPRINT_ADDRESS }}
          WEBSITE_IMPRINT_EMAIL: ${{ vars.WEBSITE_IMPRINT_EMAIL }}
          WEBSITE_UMAMI_ID: ${{ vars.WEBSITE_UMAMI_ID }}
          WEBSITE_UMAMI_DOMAINS: ${{ vars.WEBSITE_UMAMI_DOMAINS }}
        run: >-
          npx --yes netlify-cli@27.16.2 deploy
          --prod
          --context production
          --message "Version ${VERSION} (${GITHUB_SHA::7})"
