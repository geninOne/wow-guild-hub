# Veröffentlichung einer eigenen Seite auf Netlify, gedacht für Forks (jeder Produktions-Deploy kostet Credits).
# Im öffentlichen Repo geninOne/wow-guild-hub läuft er nie: Das Repo hat keine eigene Seite, dort entstehen nur
# Versionen und GitHub-Releases (release-please.yml).
#
# Auslöser:
# 1. Knopf: Actions, Release, Run workflow, Zweig wählen (meist main). Deployt genau diesen Stand.
# 2. Tag v* pushen, zum Beispiel nach "git pull upstream vX.Y.Z". Das Tag muss zur Version in package.json passen.
# Versionen werden hier nicht erhöht; sie kommen mit jedem Update aus dem öffentlichen Repo.
#
# Ohne die Secrets NETLIFY_AUTH_TOKEN und NETLIFY_SITE_ID deployt nichts: Beim Tag endet der Lauf mit einem
# Hinweis, beim Knopf mit einem Fehler.
# Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID, BNET_CLIENT_ID, BNET_CLIENT_SECRET.
# Variables: GUILD_SLUGS (Pflicht), optional GUILD_RANKS, TITLE_OPT_OUTS, WOW_VERSION, BNET_REGION, BNET_LOCALE,
# COLLECT_CONCURRENCY, COLLECT_BUDGET_MS (sonst Standardwert, siehe .env.example).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-produktion
  cancel-in-progress: false

jobs:
  voraussetzungen:
    name: Voraussetzungen
    if: github.repository != 'geninOne/wow-guild-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      bereit: ${{ steps.secrets.outputs.bereit }}
    steps:
      - name: Secrets vorhanden
        id: secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          fehlt=""
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID BNET_CLIENT_ID BNET_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then fehlt="$fehlt $name"; fi
          done
          if [ -z "$fehlt" ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Secrets fehlen:$fehlt"
            exit 1
          else
            echo "::notice::Kein Deploy, Secrets fehlen:$fehlt"
            echo "bereit=false" >> "$GITHUB_OUTPUT"
          fi

  pruefen:
    name: Prüfung
    needs: voraussetzungen
    if: needs.voraussetzungen.outputs.bereit == 'true'
    uses: ./.github/workflows/ci.yml

  veroeffentlichen:
    name: Auf Netlify veröffentlichen
    needs: [voraussetzungen, pruefen]
    if: needs.voraussetzungen.outputs.bereit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version bestimmen
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag passt zu package.json und CHANGELOG.md
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-abschnitt.mjs --pruefe-tag "$TAG"

      # Idempotent: neue Variablen anlegen, abweichende ersetzen, gleiche unverändert lassen. Gibt nur Namen aus.
      - name: Umgebungsvariablen der Netlify-Site setzen
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          GUILD_SLUGS: ${{ vars.GUILD_SLUGS }}
          GUILD_RANKS: ${{ vars.GUILD_RANKS }}
          TITLE_OPT_OUTS: ${{ vars.TITLE_OPT_OUTS }}
          WOW_VERSION: ${{ vars.WOW_VERSION }}
          BNET_REGION: ${{ vars.BNET_REGION }}
          BNET_LOCALE: ${{ vars.BNET_LOCALE }}
          COLLECT_CONCURRENCY: ${{ vars.COLLECT_CONCURRENCY }}
          COLLECT_BUDGET_MS: ${{ vars.COLLECT_BUDGET_MS }}
          # Wochenzeitung über das eigene AI Gateway, alles freiwillig: Fehlt etwas, wird es nicht gesetzt
          # (auf Netlify bleibt der bisherige Wert), und ohne URL oder Schlüssel schreiben die Satzbausteine.
          NEWSPAPER_AI_KEY: ${{ secrets.NEWSPAPER_AI_KEY }}
          NEWSPAPER_AI_URL: ${{ vars.NEWSPAPER_AI_URL }}
          NEWSPAPER_AI_MODEL: ${{ vars.NEWSPAPER_AI_MODEL }}
          NEWSPAPER_AI_EFFORT: ${{ vars.NEWSPAPER_AI_EFFORT }}
          NEWSPAPER_AI_OUTPUT_CONFIG: ${{ vars.NEWSPAPER_AI_OUTPUT_CONFIG }}
          # Angaben zur Seite (Name, Logo, Farben, Impressum ...), alle freiwillig, siehe .env.example.
          WEBSITE_NAME: ${{ vars.WEBSITE_NAME }}
          WEBSITE_LANGUAGES: ${{ vars.WEBSITE_LANGUAGES }}
          WEBSITE_NEWSPAPER: ${{ vars.WEBSITE_NEWSPAPER }}
          WEBSITE_DESCRIPTION: ${{ vars.WEBSITE_DESCRIPTION }}
          WEBSITE_TAGLINE: ${{ vars.WEBSITE_TAGLINE }}
          WEBSITE_LOGO: ${{ vars.WEBSITE_LOGO }}
          WEBSITE_LOGO_ALT: ${{ vars.WEBSITE_LOGO_ALT }}
          WEBSITE_FAVICON: ${{ vars.WEBSITE_FAVICON }}
          WEBSITE_APPLE_ICON: ${{ vars.WEBSITE_APPLE_ICON }}
          WEBSITE_OG_IMAGE: ${{ vars.WEBSITE_OG_IMAGE }}
          WEBSITE_THEME_COLOR: ${{ vars.WEBSITE_THEME_COLOR }}
          WEBSITE_COLORS: ${{ vars.WEBSITE_COLORS }}
          WEBSITE_DISCORD: ${{ vars.WEBSITE_DISCORD }}
          WEBSITE_IMPRINT_NAME: ${{ vars.WEBSITE_IMPRINT_NAME }}
          WEBSITE_IMPRINT_ADDRESS: ${{ vars.WEBSITE_IMPRINT_ADDRESS }}
          WEBSITE_IMPRINT_EMAIL: ${{ vars.WEBSITE_IMPRINT_EMAIL }}
          WEBSITE_UMAMI_ID: ${{ vars.WEBSITE_UMAMI_ID }}
          WEBSITE_UMAMI_DOMAINS: ${{ vars.WEBSITE_UMAMI_DOMAINS }}
        run: node scripts/netlify-umgebung.mjs --aus-umgebung

      # Die CLI baut selbst (npm run build mit URL der Site), bündelt die Functions samt Zeitplan
      # (collect-guild stündlich, collect-static täglich) und lädt netlify.toml mit den Redirects hoch.
      - name: Bauen und auf Netlify veröffentlichen
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TELEMETRY_DISABLED: "1"
          VERSION: ${{ steps.version.outputs.version }}
          # Die Oberfläche wird hier gebaut; die Angaben zur Seite direkt mitgeben, nicht nur auf Netlify.
          WEBSITE_NAME: ${{ vars.WEBSITE_NAME }}
          WEBSITE_LANGUAGES: ${{ vars.WEBSITE_LANGUAGES }}
          WEBSITE_NEWSPAPER: ${{ vars.WEBSITE_NEWSPAPER }}
          WEBSITE_DESCRIPTION: ${{ vars.WEBSITE_DESCRIPTION }}
          WEBSITE_TAGLINE: ${{ vars.WEBSITE_TAGLINE }}
          WEBSITE_LOGO: ${{ vars.WEBSITE_LOGO }}
          WEBSITE_LOGO_ALT: ${{ vars.WEBSITE_LOGO_ALT }}
          WEBSITE_FAVICON: ${{ vars.WEBSITE_FAVICON }}
          WEBSITE_APPLE_ICON: ${{ vars.WEBSITE_APPLE_ICON }}
          WEBSITE_OG_IMAGE: ${{ vars.WEBSITE_OG_IMAGE }}
          WEBSITE_THEME_COLOR: ${{ vars.WEBSITE_THEME_COLOR }}
          WEBSITE_COLORS: ${{ vars.WEBSITE_COLORS }}
          WEBSITE_DISCORD: ${{ vars.WEBSITE_DISCORD }}
          WEBSITE_IMPRINT_NAME: ${{ vars.WEBSITE_IMPRINT_NAME }}
          WEBSITE_IMPRINT_ADDRESS: ${{ vars.WEBSITE_IMPRINT_ADDRESS }}
          WEBSITE_IMPRINT_EMAIL: ${{ vars.WEBSITE_IMPRINT_EMAIL }}
          WEBSITE_UMAMI_ID: ${{ vars.WEBSITE_UMAMI_ID }}
          WEBSITE_UMAMI_DOMAINS: ${{ vars.WEBSITE_UMAMI_DOMAINS }}
        run: >-
          npx --yes netlify-cli@27.16.2 deploy
          --prod
          --context production
          --message "Version ${VERSION} (${GITHUB_SHA::7})"
