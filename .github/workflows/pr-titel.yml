# Prüft den Titel jedes Pull Requests auf Conventional Commits. Pull Requests werden per Squash gemergt, der Titel
# wird zur Commit-Nachricht auf main, und release-please baut daraus Version und Release-Notizen.
# Läuft mit pull_request (nie pull_request_target): keine Secrets, nur Lesezugriff, auch bei Forks.
name: PR-Titel

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  titel:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Titel prüfen
        env:
          TITEL: ${{ github.event.pull_request.title }}
        run: |
          muster='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITEL" =~ $muster ]]; then
            echo "Titel passt: $TITEL"
            exit 0
          fi
          echo "::error::Der Titel folgt nicht Conventional Commits: \"$TITEL\""
          echo "Form: <type>(<optional scope>): <summary>, z. B. \"feat(professions): filter by recipe rank\" oder \"fix: footer version\"."
          echo "Types: feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore. \"!\" vor dem Doppelpunkt kennzeichnet eine Breaking Change."
          exit 1
