# Versions and releases of the public repo, without deploy (the repo has no site of its own).
#
# After every push to main, release-please maintains a release PR "chore(main): release X.Y.Z" with the new version
# in package.json and package-lock.json, the section in CHANGELOG.md and .release-please-manifest.json. The version
# follows from the Conventional Commits since the last release: fix = patch, feat = minor, "!" or
# BREAKING CHANGE = major. When the release PR is merged, the tag vX.Y.Z and a GitHub release with the same notes
# are created. Settings: release-please-config.json.
#
# Token: with the GitHub App (variable BOT_APP_CLIENT_ID, secret BOT_APP_PRIVATE_KEY) the checks also run on the
# release PR. Without the app the workflow uses GITHUB_TOKEN; then "Allow GitHub Actions to create and approve pull
# requests" must be on under Settings, Actions, General, and the checks do not start on the release PR by themselves
# (PRs created with GITHUB_TOKEN trigger no workflows).
#
# Runs only in geninOne/wow-guild-hub, never in forks or in the private repo that pulls from upstream.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and release
    if: github.repository == 'geninOne/wow-guild-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: GitHub App token
        id: app
        if: vars.BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One-off: the first version was written into CHANGELOG.md and the manifest by hand. As long as there is no
      # release at all, it is created here from that section, so release-please counts on from there.
      - name: Create the first release if there is none yet
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$(gh release list --limit 1 --json tagName --jq '.[].tagName')" ]; then
            echo "Releases exist already, nothing to do."
            exit 0
          fi
          version="$(node -p "require('./.release-please-manifest.json')['.']")"
          node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"

      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # For a new major version, the section with the breaking changes in the GitHub release is called
      # "Upgrade notes", so operators see right away what they have to adjust (environment variables, Netlify steps).
      - name: Upgrade notes for a major version
        if: steps.release.outputs.release_created == 'true' && steps.release.outputs.minor == '0' && steps.release.outputs.patch == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          sed -i 's/^### ⚠ BREAKING CHANGES$/### ⚠ Upgrade notes (breaking changes)/' "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
