# Prüfung bei jedem Push und Pull Request auf main. Deployt nichts.
# release.yml ruft diesen Workflow vor jedem Deploy auf (workflow_call).
name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pruefen:
    name: Lint, Tests, Typen, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
