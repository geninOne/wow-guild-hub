# Checks on every push and pull request to main. Deploys nothing.
# release.yml calls this workflow before every deploy (workflow_call).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # The job name is a required status check in the branch protection of main. Rename it only together with the
    # branch protection setting.
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Code, comments, tests and messages stay English; UI texts, translations and frozen names are left out.
      - run: npm run check:english -- --all --strict
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
