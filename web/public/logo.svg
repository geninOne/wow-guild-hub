<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Neutrales Platzhalter-Wappen: Schild mit Streitaxt. Eigenes Logo über SEITE_LOGO. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c9952e"/>
    </linearGradient>
    <linearGradient id="klinge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.55" stop-color="#f2c95a"/>
      <stop offset="1" stop-color="#c9952e"/>
    </linearGradient>
    <linearGradient id="feld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a34"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
  </defs>
  <path d="M128 12 228 44v78c0 62-42 104-100 122C70 226 28 184 28 122V44Z" fill="url(#gold)"/>
  <path d="M128 28 212 55v67c0 52-35 88-84 104-49-16-84-52-84-104V55Z" fill="url(#feld)"/>
  <g transform="rotate(24 128 128)">
    <!-- Stiel mit Knauf -->
    <path d="M128 66V206" stroke="#8a6420" stroke-width="18" stroke-linecap="round"/>
    <path d="M128 66V206" stroke="#e8b94a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="128" cy="208" r="9" fill="url(#gold)" stroke="#8a6420" stroke-width="3"/>
    <!-- Klinge, nach rechts geschwungen, mit Bart nach unten -->
    <path d="M134 72 C150 68 160 62 170 50 C204 84 206 124 180 156 C168 140 152 128 134 122 Z" fill="url(#klinge)" stroke="#8a6420" stroke-width="4" stroke-linejoin="round"/>
    <path d="M174 60 C198 90 199 122 180 146" fill="none" stroke="#fff4d6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- Dorn nach hinten -->
    <path d="M122 76 L98 86 L122 98 Z" fill="url(#klinge)" stroke="#8a6420" stroke-width="4" stroke-linejoin="round"/>
    <!-- Spitze oben -->
    <path d="M122 68 L128 46 L134 68 Z" fill="url(#klinge)" stroke="#8a6420" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
